[package]
name = "pg_sqlite_heap"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_sqlite_heap"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg18"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
# The pg_test feature compiles the in-postgres test module into the cdylib,
# so any deps used inside `#[pg_test]` must be present in the regular dep
# graph (not just dev-dependencies). insta is one such dep.
pg_test = ["dep:insta"]

[dependencies]
pgrx = "=0.17.0"
rusqlite = { version = "0.31", features = ["bundled"] }
insta = { version = "1", optional = true }

[dev-dependencies]
pgrx-tests = "=0.17.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
